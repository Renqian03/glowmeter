[project]
name = "instrument"
version = "0.1.0"
description = "Command-line client for the class-board instrument (WebSocket JSON protocol)"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
    "typer>=0.12",
]

[project.scripts]
instrument = "instrument:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["instrument"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
